<div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10 animate-fade-in">
    <app-page-breadcrumb pageTitle="Lista de Roles" />

    <div class="mb-8 flex flex-col gap-5 md:flex-row md:items-center md:justify-between">

        <div class="flex items-center gap-3">
            <div class="h-8 w-1.5 bg-brand-500 rounded-full"></div>
            <h3 class="text-xl font-bold text-slate-800 dark:text-white">Lista de Roles</h3>
        </div>
        <a *ngIf="canManageRoles" routerLink="/roles/add"
            class="bg-brand-500 text-white hover:bg-brand-600 transition-all shadow-lg shadow-brand-500/30 font-bold px-6 py-3 rounded-xl border-none active:scale-95 flex items-center justify-center gap-2">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span>Nuevo Rol</span>
        </a>
    </div>

    <div
        class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden dark:bg-boxdark dark:border-strokedark">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-600 dark:text-gray-400">
                <thead
                    class="bg-slate-50/50 text-xs font-black uppercase tracking-widest text-slate-500 dark:bg-gray-800">
                    <tr>
                        <th class="px-7 py-4">Nombre</th>
                        <th class="px-7 py-4">Código</th>
                        <th class="px-7 py-4">Descripción</th>
                        <th *ngIf="canManageRoles" class="px-7 py-4 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-50 dark:divide-gray-800">
                    <tr *ngFor="let role of roles"
                        class="hover:bg-slate-50/50 dark:hover:bg-white/[0.03] transition-colors">
                        <td class="px-7 py-5 font-bold text-slate-800 dark:text-white">{{ role.name }}</td>
                        <td class="px-7 py-5">
                            <span
                                class="inline-flex items-center rounded-lg bg-indigo-50 px-2 py-0.5 text-[10px] font-black uppercase tracking-wider text-indigo-600 border border-indigo-100">
                                {{ role.code }}
                            </span>
                        </td>
                        <td class="px-7 py-5 text-slate-500">{{ role.description || '-' }}</td>
                        <td *ngIf="canManageRoles" class="px-7 py-5">
                            <div class="flex items-center justify-center gap-2">
                                <button [routerLink]="['/roles/edit', role.id]"
                                    class="h-9 w-9 flex items-center justify-center rounded-lg text-blue-600 hover:text-white hover:bg-blue-500 transition-colors bg-blue-50"
                                    title="Editar">
                                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                                        </path>
                                    </svg>
                                </button>
                                <button (click)="deleteRole(role.id)"
                                    class="h-9 w-9 flex items-center justify-center rounded-lg text-rose-600 hover:text-white hover:bg-rose-500 transition-colors bg-rose-50"
                                    title="Eliminar">
                                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                        </path>
                                    </svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>


            <!-- Loading State -->
            <div *ngIf="loading" class="flex flex-col items-center justify-center py-24">
                <div
                    class="h-10 w-10 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent mb-4">
                </div>
                <p class="text-slate-500 font-medium">Cargando roles...</p>
            </div>

            <!-- Empty State -->
            <div *ngIf="!loading && roles.length === 0" class="flex flex-col items-center justify-center py-20 px-4">
                <div
                    class="h-24 w-24 rounded-3xl bg-slate-50 dark:bg-slate-800 flex items-center justify-center text-slate-200 dark:text-slate-700 mb-6">
                    <svg class="h-14 w-14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                        </path>
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-2">No se encontraron roles</h3>
                <p class="text-slate-500 text-center max-w-sm">
                    No encontramos registros de roles. Comienza agregando uno nuevo.
                </p>
                <a *ngIf="!loading && canManageRoles" routerLink="/roles/add"
                    class="mt-6 bg-brand-500 text-white px-6 py-2 rounded-xl font-bold shadow-lg shadow-brand-500/30 hover:bg-brand-600 transition-all active:scale-95">
                    + Nuevo Rol
                </a>
            </div>
        </div>
    </div>
