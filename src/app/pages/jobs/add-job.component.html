<div>
  <app-page-breadcrumb [pageTitle]="isEditMode ? 'Editar Trabajo' : 'Nuevo Trabajo'" />

  <!-- Alert -->
  <div class="mb-6" *ngIf="showAlert">
    <div [ngClass]="{
      'border-l-4 p-4 rounded-lg': true,
      'bg-green-50 border-green-500 text-green-800 dark:bg-green-900/20 dark:text-green-400': alertType === 'success',
      'bg-red-50 border-red-500 text-red-800 dark:bg-red-900/20 dark:text-red-400': alertType === 'error',
      'bg-yellow-50 border-yellow-500 text-yellow-800 dark:bg-yellow-900/20 dark:text-yellow-400': alertType === 'warning',
      'bg-blue-50 border-blue-500 text-blue-800 dark:bg-blue-900/20 dark:text-blue-400': alertType === 'info'
    }" role="alert">
      <div class="flex items-center justify-between">
        <p class="font-medium">{{ alertMessage }}</p>
        <button (click)="closeAlert()" class="ml-4 hover:opacity-70">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="space-y-6">
    <!-- Formulario -->
    <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
      <div class="border-b border-gray-200 px-6 py-4 dark:border-gray-800">
        <h2 class="text-lg font-medium text-gray-800 dark:text-white">
          Información del Trabajo
        </h2>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          Complete los datos del trabajo
        </p>
      </div>
      <div class="p-4 sm:p-6">
        <form (ngSubmit)="onSubmit()" class="space-y-6">
          <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
            <!-- Nombre -->
            <div>
              <app-label>
                Nombre <span class="text-error-500">*</span>
              </app-label>
              <app-input-field
                type="text"
                name="name"
                [(value)]="name"
                placeholder="Ingrese el nombre del trabajo"
                required
                (keydownEnter)="onSubmit()"
              ></app-input-field>
            </div>

            <!-- Fecha Inicio -->
            <div>
              <app-label>
                Fecha Inicio <span class="text-error-500">*</span>
              </app-label>
              <div class="relative">
                <app-date-picker
                  id="startDate"
                  placeholder="Seleccione una fecha"
                  [dateFormat]="'Y-m-d'"
                  [defaultDate]="startDateObject"
                  [locale]="'es'"
                  [firstDayOfWeek]="1"
                  (dateChange)="onDateChange($event)"
                ></app-date-picker>
                @if (startDateDisplay) {
                  <div class="mt-2 px-4 py-2 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700">
                    <p class="text-sm text-gray-600 dark:text-gray-400">
                      Fecha seleccionada: <span class="font-medium text-gray-800 dark:text-gray-200">{{ startDateDisplay }}</span>
                    </p>
                  </div>
                }
              </div>
            </div>
          </div>

          <!-- Descripción -->
          <div>
            <app-label>
              Descripción
            </app-label>
            <app-text-area
              placeholder="Ingrese la descripción del trabajo"
              [value]="description"
              (valueChange)="description = $event"
              [rows]="5"
            ></app-text-area>
          </div>

          <!-- Botones de Acción -->
          <div class="flex flex-col gap-3 sm:flex-row sm:justify-end pt-4">
            <app-button
              variant="outline"
              size="md"
              type="button"
              (btnClick)="onCancel()"
              [disabled]="isLoading"
            >
              Cancelar
            </app-button>
            <app-button
              variant="primary"
              size="md"
              type="submit"
              [disabled]="isLoading"
            >
              <span *ngIf="!isLoading">{{ isEditMode ? 'Guardar' : 'Guardar' }}</span>
              <span *ngIf="isLoading">
                <svg class="animate-spin h-5 w-5 inline-block mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                {{ isEditMode ? 'Guardando...' : 'Guardando...' }}
              </span>
            </app-button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
