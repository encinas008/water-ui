<div>
  <app-page-breadcrumb [pageTitle]="isEditMode ? 'Editar Trabajo' : 'Nuevo Trabajo'" />



  <div class="space-y-6">
    <!-- Formulario -->
    <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
      <div class="border-b border-gray-200 px-6 py-4 dark:border-gray-800">
        <h2 class="text-lg font-medium text-gray-800 dark:text-white">
          Información del Trabajo
        </h2>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          Complete los datos del trabajo
        </p>
      </div>
      <div class="p-4 sm:p-6">
        <form (ngSubmit)="onSubmit()" class="space-y-6">
          <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
            <!-- Nombre -->
            <div>
              <app-label>
                Nombre <span class="text-error-500">*</span>
              </app-label>
              <app-input-field type="text" name="name" [(value)]="name" placeholder="Ingrese el nombre del trabajo"
                required (keydownEnter)="onSubmit()"></app-input-field>
            </div>

            <!-- Fecha Inicio -->
            <div>
              <app-label>
                Fecha Inicio <span class="text-error-500">*</span>
              </app-label>
              <div class="relative">
                <app-date-picker id="startDate" placeholder="Seleccione una fecha" [dateFormat]="'Y-m-d'"
                  [defaultDate]="startDateObject" [locale]="'es'" [firstDayOfWeek]="1"
                  (dateChange)="onDateChange($event)"></app-date-picker>
                @if (startDateDisplay) {
                <div
                  class="mt-2 px-4 py-2 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700">
                  <p class="text-sm text-gray-600 dark:text-gray-400">
                    Fecha seleccionada: <span class="font-medium text-gray-800 dark:text-gray-200">{{ startDateDisplay
                      }}</span>
                  </p>
                </div>
                }
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
            <!-- Multa -->
            <div>
              <app-label>
                Multa
              </app-label>
              <app-input-field type="number" name="fine" [(value)]="fine" placeholder="0.00" min="0"
                [step]="0.01"></app-input-field>
            </div>
          </div>

          <!-- Descripción -->
          <div>
            <app-label>
              Descripción
            </app-label>
            <app-text-area placeholder="Ingrese la descripción del trabajo" [value]="description"
              (valueChange)="description = $event" [rows]="5"></app-text-area>
          </div>

          <!-- Botones de Acción -->
          <div class="flex flex-col gap-3 sm:flex-row sm:justify-end pt-4">
            <app-button variant="outline" size="md" type="button" (btnClick)="onCancel()" [disabled]="isLoading">
              Cancelar
            </app-button>
            <app-button variant="primary" size="md" type="submit" [disabled]="isLoading">
              <span *ngIf="!isLoading">{{ isEditMode ? 'Guardar' : 'Guardar' }}</span>
              <span *ngIf="isLoading">
                <svg class="animate-spin h-5 w-5 inline-block mr-2" xmlns="http://www.w3.org/2000/svg" fill="none"
                  viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                  </path>
                </svg>
                {{ isEditMode ? 'Guardando...' : 'Guardando...' }}
              </span>
            </app-button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
