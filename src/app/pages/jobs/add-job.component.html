<div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10 animate-fade-in">
  <app-page-breadcrumb [pageTitle]="isEditMode ? 'Editar Trabajo' : 'Nuevo Trabajo'" />

  <div class="space-y-6">
    <!-- Formulario -->
    <div
      class="rounded-3xl border border-slate-100 bg-white shadow-sm dark:border-strokedark dark:bg-boxdark animate-fade-in"
      style="animation-delay: 100ms;">
      <div class="border-b border-slate-100 px-7 py-5 dark:border-slate-800">
        <h2 class="text-lg font-bold text-slate-800 dark:text-white">
          Información del Trabajo
        </h2>
        <p class="mt-1 text-sm font-medium text-slate-500 dark:text-slate-400">
          Complete los datos del trabajo
        </p>
      </div>
      <div class="p-7">
        <form (ngSubmit)="onSubmit()" class="space-y-6">
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
            <!-- Nombre -->
            <div>
              <app-label>
                <span class="font-bold text-slate-700 dark:text-slate-300">Nombre</span> <span
                  class="text-rose-500 ml-1">*</span>
              </app-label>
              <app-input-field type="text" name="name" [value]="name" (valueChange)="onNameInput($event)"
                placeholder="Ingrese el nombre del trabajo" required (keydownEnter)="onSubmit()"
                [disabled]="isLoading || !canModify()"></app-input-field>
            </div>

            <!-- Fecha Inicio -->
            <div>
              <app-label>
                <span class="font-bold text-slate-700 dark:text-slate-300">Fecha Inicio</span> <span
                  class="text-rose-500 ml-1">*</span>
              </app-label>
              <div class="relative">
                <app-date-picker id="startDate" placeholder="Seleccione una fecha" [dateFormat]="'Y-m-d'"
                  [defaultDate]="startDateObject" [locale]="'es'" [firstDayOfWeek]="1"
                  (dateChange)="onDateChange($event)" [disabled]="isLoading || !canModify()"></app-date-picker>
                @if (startDateDisplay) {
                <div
                  class="mt-2 px-4 py-2 bg-indigo-50 dark:bg-indigo-900/20 rounded-xl border border-indigo-100 dark:border-indigo-800">
                  <p class="text-sm text-indigo-700 dark:text-indigo-300">
                    Fecha seleccionada: <span class="font-bold">{{ startDateDisplay }}</span>
                  </p>
                </div>
                }
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
            <!-- Multa -->
            <div>
              <app-label>
                <span class="font-bold text-slate-700 dark:text-slate-300">Multa</span> <span
                  class="text-rose-500 ml-1">*</span>
              </app-label>
              <app-input-field type="text" name="fine" [value]="fine" (valueChange)="onFineChange($event)"
                appNumberLimit [maxLimit]="9999999.99" [minLimit]="1" placeholder="0.00"
                [disabled]="isLoading || !canModify()"></app-input-field>
            </div>
          </div>

          <!-- Descripción -->
          <div>
            <app-label>
              <span class="font-bold text-slate-700 dark:text-slate-300">Descripción</span>
            </app-label>
            <app-text-area placeholder="Ingrese la descripción del trabajo" [value]="description"
              (valueChange)="description = $event" [rows]="5" [disabled]="isLoading || !canModify()"></app-text-area>
          </div>

          <!-- Botones de Acción -->
          <div
            class="flex flex-col gap-4 sm:flex-row sm:justify-end pt-6 border-t border-slate-100 dark:border-slate-800">
            <app-button variant="primary" size="md" type="submit" [disabled]="!isFormValid || isLoading || !canModify()"
              [className]="'bg-brand-500 text-white hover:bg-brand-600 transition-all shadow-lg shadow-brand-500/30 font-bold px-8 py-3 rounded-xl border-none active:scale-95'">
              <span *ngIf="!isLoading">{{ isEditMode ? 'Guardar Cambios' : 'Crear Trabajo' }}</span>
              <span *ngIf="isLoading" class="flex items-center">
                <svg class="animate-spin h-5 w-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none"
                  viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                  </path>
                </svg>
                Guardando...
              </span>
            </app-button>
            <app-button variant="secondary" size="md" type="button" (btnClick)="onCancel()" [disabled]="isLoading"
              [className]="'bg-blue-500 hover:bg-blue-600 text-white font-bold px-8 py-3 rounded-xl shadow-lg shadow-blue-500/20 border-none active:scale-95 transition-all'">
              Cancelar
            </app-button>

          </div>
        </form>
      </div>
    </div>
  </div>
</div>
